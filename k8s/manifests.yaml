apiVersion: v1
kind: Namespace
metadata:
  name: live-workshop
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: live-workshop
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: workshop
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "workshop", "-d", "workshop"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: live-workshop
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: live-workshop
spec:
  # shortcut: 1 replica matches single-instance Tokio broadcast hub; scale >1 after adding Redis pub/sub
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: live-workshop-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:3001"
            - name: DEMO_ENABLED
              value: "true"
            - name: ALLOWED_ORIGINS
              value: "http://localhost:3000,http://127.0.0.1:3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: DATABASE_URL
            - name: FACILITATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: FACILITATOR_TOKEN
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: ADMIN_TOKEN
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: live-workshop
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: live-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: live-workshop-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: BETTER_AUTH_URL
              value: "http://localhost:3000"
            - name: BETTER_AUTH_DB_URL
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: workshop-secrets
                  key: BETTER_AUTH_SECRET
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: live-workshop
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: live-workshop-ingress
  namespace: live-workshop
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
